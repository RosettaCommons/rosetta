name: Build Rosetta

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Rosetta inside a container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/rosetta" \
            -w /rosetta/source \
            ubuntu:22.04 \
            bash -c '
              apt-get update && \
              apt-get install -y build-essential python3 python3-dev zlib1g-dev && \
              ./scons.py -j2 mode=release rna_denovo
